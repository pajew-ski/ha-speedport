name: Release

on:
  release:
    types: [published]

jobs:
  release-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ZIP Component Dir
        run: |
          cd ${{ github.workspace }}/custom_components/speedport
          zip -r speedport.zip ./

      - name: Upload zip to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.workspace }}/custom_components/speedport/speedport.zip
          asset_name: speedport.zip
          tag: ${{ github.ref }}
          overwrite: true